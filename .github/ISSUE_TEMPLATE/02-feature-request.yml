name: 功能许愿
description: 这是许愿池：只保证会看，不承诺采纳、实现或排期。
title: "[许愿] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        这是作者的个人 vibe coding 项目，功能、界面与优先级主要按作者自己的使用需求和喜好决定。

        **你可以把这里当作许愿池：欢迎切合实际的建议，只保证会看，不保证回复、采纳、实现或给出排期。**
        作者不喜欢、不符合项目方向或不想维护的建议，会直接关闭，不一定逐条解释。请勿催更，也不要通过重复开 issue 要求重新考虑。
  - type: checkboxes
    id: checks
    attributes:
      label: 许愿前确认
      options:
        - label: 我已搜索本仓库已有的 issue；相同建议会在原 issue 补充，不重复提交。
          required: true
        - label: 我理解这是个人项目，作者只保证会看，不承诺回复、采纳、实现或排期。
          required: true
        - label: 我接受作者按个人喜好直接关闭建议，不催更、不要求照搬其他项目。
          required: true
  - type: textarea
    id: scenario
    attributes:
      label: 实际使用场景
      description: 你在什么场景遇到了什么不便？请说自己的需求，而不只是“别的客户端有”。
      placeholder: 我在……时，需要……；目前的操作不方便在于……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你想许什么愿
      description: 具体希望增加或调整什么？尽量一条 issue 讨论一个建议。
      placeholder: 希望在……位置提供……，操作后能够……
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 涉及平台
      options:
        - Android
        - Windows
        - Linux
        - iOS
        - 通用 / 不限定平台
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代办法（选填）
      description: 你现在怎样完成这件事？是否有更简单、改动更小的办法？
  - type: textarea
    id: references
    attributes:
      label: 参考与补充（选填）
      description: 可附截图、草图或链接，仅作理解需求的参考，不构成必须照搬的理由。请注意脱敏。
